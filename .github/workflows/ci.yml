name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: macos-latest
    permissions:
      contents: read
      checks: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 20

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'

    - name: Boot test simulator
      if: github.event_name == 'pull_request'
      run: |
        CI_SIMULATOR_ID=$(xcrun simctl create 'Friendly CI' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-26-5)
        xcrun simctl boot "$CI_SIMULATOR_ID"
        echo "CI_SIMULATOR_ID=$CI_SIMULATOR_ID" >> "$GITHUB_ENV"
    
    - name: Setup Ruby
      if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2
        bundler-cache: true
    
    - name: Install Mise and Tuist
      uses: jdx/mise-action@v2
      with:
        install: false
        
    - name: Install Tuist
      run: |
        mise use -g tuist@latest
        tuist version
    
    - name: Install dependencies
      run: |
        tuist install
    
    - name: Generate project
      run: |
        tuist generate
    
    - name: Run tests
      id: tests
      if: github.event_name == 'pull_request'
      run: |
        xcodebuild test \
          -workspace Friendly.xcworkspace \
          -scheme CommunityTests \
          -destination "platform=iOS Simulator,id=$CI_SIMULATOR_ID" \
          -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
          -skipMacroValidation \
          ARCHS=arm64 \
          CODE_SIGNING_ALLOWED=NO

    - name: Publish test report
      if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.tests.outcome != 'skipped' }}
      uses: actions/github-script@v9
      with:
        script: |
          const { execFileSync } = require('node:child_process');
          const bundle = `${process.env.RUNNER_TEMP}/TestResults.xcresult`;
          if (!require('node:fs').existsSync(bundle)) {
            core.warning('Xcode did not produce a test result bundle.');
            return;
          }
          execFileSync('ditto', ['-c', '-k', '--keepParent', bundle, `${bundle}.zip`]);
          const report = JSON.parse(execFileSync('xcrun', [
            'xcresulttool', 'get', 'test-results', 'summary', '--path', bundle, '--compact'
          ], { encoding: 'utf8' }));
          const title = `${report.passedTests} passed, ${report.failedTests} failed, ${report.skippedTests} skipped`;
          const failures = report.testFailures.map(failure =>
            `### ${failure.testIdentifierString}\n\n${failure.failureText}`
          ).join('\n\n');
          const summary = `## ${title}\n\n${failures}`;
          await core.summary.addRaw(summary).write();
          if (context.payload.pull_request.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) return;
          await github.rest.checks.create({
            ...context.repo,
            head_sha: context.sha,
            name: `Tests: ${title}`,
            status: 'completed',
            conclusion: report.result === 'Passed' ? 'success' : 'failure',
            details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            output: { title, summary: summary.slice(0, 65535) }
          });

    - name: Save test results
      if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.tests.outcome != 'skipped' }}
      uses: actions/upload-artifact@v7
      with:
        name: TestResults
        path: ${{ runner.temp }}/TestResults.xcresult.zip
        if-no-files-found: ignore
    
    - name: Install certificates and provisioning profiles
      if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      env:
        CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
        CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # Create temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        
        # Install certificate
        echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
        security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
        
        # Install provisioning profile
        echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
        bundle exec fastlane run install_provisioning_profile path:"profile.mobileprovision"
    
    - name: Build and upload to TestFlight
      if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      env:
        APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
        APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_KEY_CONTENT_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_CONTENT_BASE64 }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        bundle exec fastlane beta
    
    - name: Build only (test mode)
      if: (github.ref != 'refs/heads/main' || github.event_name == 'pull_request') && github.event_name != 'workflow_dispatch'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        xcodebuild -workspace Friendly.xcworkspace -scheme Friendly -configuration Release -destination 'generic/platform=iOS' -skipMacroValidation build ARCHS=arm64 CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
